name: DCO

on:
  pull_request:
    branches: [main]

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check DCO (Signed-off-by)
        run: |
          base_sha=$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)
          for commit in $(git rev-list "$base_sha"..HEAD); do
            body=$(git log -1 --format='%B' "$commit")
            if ! echo "$body" | grep -q "Signed-off-by:"; then
              echo "ERROR: Commit $(git log -1 --format='%h %s' "$commit") is missing Signed-off-by"
              echo "Use: git commit -s"
              exit 1
            fi
          done
